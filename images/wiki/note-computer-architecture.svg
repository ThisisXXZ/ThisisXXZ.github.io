<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <!-- Original flat architecture icon: compute tiles, memory banks and interconnects. -->
  <rect x="11" y="5" width="46" height="53" rx="6" fill="#fff7f3" stroke="#29252a" stroke-width="2"/>
  <!-- A shared visual language for buses and junctions. -->
  <g fill="none" stroke="#b75b62" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 18h5v-5h4M35 24h15M26 30v7h16v9h3M21 30v5h-5v7M33 30v3h7M49 33v4h-4v6M19 49v4h17v-5"/>
  </g>
  <g fill="#b75b62">
    <circle cx="40" cy="13" r="1.7"/>
    <circle cx="16" cy="35" r="1.7"/>
    <circle cx="36" cy="53" r="1.7"/>
  </g>
  <!-- Two abstract external interfaces. -->
  <g fill="#29252a">
    <rect x="5" y="15" width="9" height="8" rx="2"/>
    <rect x="5" y="28" width="9" height="7" rx="2"/>
  </g>
  <path d="M8 19h3M8 31.5h3" stroke="#fff7f3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Four compute tiles within one processing unit. -->
  <g stroke="#29252a" stroke-width="1.8" stroke-linecap="round">
    <path d="M23 10v4m7-4v4M23 29v3m7-3v3M16 18h4m-4 7h4M34 18h3m-3 7h3"/>
  </g>
  <rect x="19" y="13" width="16" height="17" rx="3" fill="#d9363e"/>
  <g fill="#fff7f3">
    <rect x="22" y="16" width="4" height="4" rx=".8"/>
    <rect x="28" y="16" width="4" height="4" rx=".8"/>
    <rect x="22" y="23" width="4" height="4" rx=".8"/>
    <rect x="28" y="23" width="4" height="4" rx=".8"/>
  </g>
  <!-- Memory is expressed as paired banks, without hardware texture. -->
  <g fill="#ed8178">
    <rect x="43" y="11" width="4" height="10" rx="1"/>
    <rect x="43" y="23" width="4" height="10" rx="1"/>
    <rect x="50" y="11" width="4" height="10" rx="1"/>
    <rect x="50" y="23" width="4" height="10" rx="1"/>
  </g>
  <!-- Horizontal system buses and the I/O unit. -->
  <rect x="16" y="40" width="22" height="4" rx="1.2" fill="#ed8178"/>
  <rect x="16" y="47" width="22" height="4" rx="1.2" fill="#d9363e"/>
  <path d="M27 40v4m0 3v4" stroke="#fff7f3" stroke-width="2"/>
  <rect x="44" y="43" width="9" height="9" rx="2" fill="#29252a"/>
  <path d="M47 47.5h3" stroke="#fff7f3" stroke-width="1.5" stroke-linecap="round"/>
</svg>
